openapi: 3.1.0
info:
  title: Checkout pricing contract
  version: 2.0.0
paths:
  /price:
    post:
      operationId: priceOrder
      responses:
        '200':
          description: Priced order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceResponse'
components:
  schemas:
    PriceResponse:
      type: object
      additionalProperties: false
      required: [order_id, total, currency]
      properties:
        order_id:
          type: string
        total:
          type: integer
          minimum: 0
        currency:
          type: string
          pattern: '^[A-Z]{3}$'

