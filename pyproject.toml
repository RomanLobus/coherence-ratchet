[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "coherence-ratchet"
version = "0.1.0"
description = "A deterministic coherence-debt ratchet for AI-assisted change: measure duplication, dependency cycles, and connascence; hold or tighten a per-region budget; record accepted debt in an owned, dated ledger."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Roman Lobus" }]
keywords = ["coherence", "technical-debt", "architecture", "ratchet", "ci", "ai-assisted", "coherence-debt"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/RomanLobus/coherence-ratchet"
Repository = "https://github.com/RomanLobus/coherence-ratchet"
Changelog = "https://github.com/RomanLobus/coherence-ratchet/blob/main/CHANGELOG.md"

[project.scripts]
coherence-ratchet = "coherence_ratchet.cli:main"

[tool.setuptools]
packages = ["coherence_ratchet"]

[tool.setuptools.package-dir]
"" = "."
