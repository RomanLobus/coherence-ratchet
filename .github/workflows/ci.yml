name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: install
        run: pip install -e ./ratchet-mvp
      - name: tests
        run: python ratchet-mvp/tests/run.py
      - name: quickstart smoke (deterministic floor, offline)
        run: |
          coherence-ratchet measure ratchet-mvp/playground/_states/03-loyalty/billing
          coherence-ratchet selfmodel derive ratchet-mvp/playground/_states/03-loyalty/billing --model /tmp/sm.json
          coherence-ratchet selfmodel query "which sites compute retry?" --model /tmp/sm.json
          coherence-ratchet init ratchet-mvp/playground/_states/00-baseline/billing --budgets /tmp/b.json \
            --by "ci-smoke" --reason "baseline for the offline smoke test"
          if coherence-ratchet check ratchet-mvp/playground/_states/03-loyalty/billing --budgets /tmp/b.json; then
            echo "expected the ratchet to trip" && exit 1
          fi
          coherence-ratchet check ratchet-mvp/playground/_states/03-loyalty/billing --budgets /tmp/b.json \
            --accept --owner "billing-team" --trigger "smoke / never" --region "billing.loyalty" \
            --volatility medium --coordination-span low --criticality medium \
            --discoverability low --blast-radius low \
            --evidence "REPRODUCIBLE_FIXTURE: ratchet-mvp/playground/_states/03-loyalty" \
            --confidence medium --review-date 2027-01-01 --repayment-feasibility medium \
            --ledger /tmp/ledger.jsonl
          coherence-ratchet report --ledger /tmp/ledger.jsonl
      - name: an accept missing its assessment must be refused, not silently recorded
        run: |
          if coherence-ratchet check ratchet-mvp/playground/_states/03-loyalty/billing --budgets /tmp/b.json \
              --accept --owner "billing-team" --trigger "smoke / never" \
              --ledger /tmp/bad.jsonl; then
            echo "expected refusal: an accept without its exposure assessment" && exit 1
          fi
      - name: compare fixtures (REFUTED and NO_DIVERGENCE_FOUND paths)
        run: |
          F=ratchet-mvp/_fixtures/consolidation
          if coherence-ratchet compare "$F::variants.to_cents_half_up" "$F::variants.to_cents_half_even"; then
            echo "expected REFUTED" && exit 1
          fi
          coherence-ratchet compare "$F::variants.retry_orig" "$F::variants.retry_faithful" --strategy $F/retry_strategy.py

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install build && python -m build ratchet-mvp --outdir dist
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
