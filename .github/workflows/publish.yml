name: publish

# Publishes to PyPI via trusted publishing when a GitHub release is published.
# One-time setup required on pypi.org: project "coherence-ratchet" -> add a
# trusted publisher for RomanLobus/coherence-ratchet, workflow publish.yml,
# environment pypi.

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install build && python -m build ratchet-mvp --outdir dist
      - uses: pypa/gh-action-pypi-publish@release/v1
