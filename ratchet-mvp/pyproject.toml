[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "coherence-ratchet"
version = "0.5.0"
description = "A coherence-debt ratchet that separates observed structure, ratified intent, exposure decisions, and bounded behavioural evidence."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Roman Lobus" }]
keywords = ["coherence", "technical-debt", "architecture", "ratchet", "ci", "ai-assisted", "coherence-debt"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/RomanLobus/coherence-ratchet"
Repository = "https://github.com/RomanLobus/coherence-ratchet"
Changelog = "https://github.com/RomanLobus/coherence-ratchet/blob/main/ratchet-mvp/CHANGELOG.md"

[project.scripts]
coherence-ratchet = "coherence_ratchet.cli:main"

[tool.setuptools]
packages = ["coherence_ratchet"]

[tool.setuptools.package-dir]
"" = "."
