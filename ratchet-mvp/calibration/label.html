')\n        Sentinel.__module__ = module\n\n    return Sentinel()", "b_file": "urlutils.py", "b_line": 1134, "b_src": "    def get(self, k, default=None):\n        \"\"\"Return the value for key *k* if present in the dictionary, else\n        *default*. If *default* is not given, ``None`` is returned.\n        This method never raises a :exc:`KeyError`.\n\n        To get all values under a key, use :meth:`OrderedMultiDict.getlist`.\n        \"\"\"\n        return super().get(k, [default])[-1]", "library": "boltons"}, {"a": "tableutils.get_entry", "b": "urlutils.to_text", "jaccard": 0.0, "label": null, "a_file": "tableutils.py", "a_line": 202, "a_src": "    def get_entry(self, obj, headers):\n        return [getattr(obj, h, None) for h in headers]", "b_file": "urlutils.py", "b_line": 1589, "b_src": "    def to_text(self, full_quote=False):\n        \"\"\"\n        Render and return a query string.\n\n        Args:\n           full_quote (bool): Whether or not to percent-quote special\n              characters or leave them decoded for readability.\n        \"\"\"\n        ret_list = []\n        for k, v in self.iteritems(multi=True):\n            key = quote_query_part(to_unicode(k), full_quote=full_quote)\n            if v is None:\n                ret_list.append(key)\n            else:\n                val = quote_query_part(to_unicode(v), full_quote=full_quote)\n                ret_list.append('='.join((key, val)))\n        return '&'.join(ret_list)", "library": "boltons"}, {"a": "dictutils._clear_ll", "b": "strutils.bytes2human", "jaccard": 0.0, "label": null, "a_file": "dictutils.py", "a_line": 663, "a_src": "    def _clear_ll(self):\n        # TODO: always reset objects? (i.e., no else block below)\n        try:\n            _map = self._map\n        except AttributeError:\n            _map = self._map = {}\n            self.root = []\n        _map.clear()\n        self.root[:] = [self.root, self.root,\n                        None, None,\n                        self.root, self.root]", "b_file": "strutils.py", "b_line": 558, "b_src": "def bytes2human(nbytes, ndigits=0):\n    \"\"\"Turns an integer value of *nbytes* into a human readable format. Set\n    *ndigits* to control how many digits after the decimal point\n    should be shown (default ``0``).\n\n    >>> bytes2human(128991)\n    '126K'\n    >>> bytes2human(100001221)\n    '95M'\n    >>> bytes2human(0, 2)\n    '0.00B'\n    >>> bytes2human(1024)\n    '1K'\n    \"\"\"\n    abs_bytes = abs(nbytes)\n    for (size, symbol), (next_size, next_symbol) in _SIZE_RANGES:\n        if abs_bytes < next_size:\n            break\n    hnbytes = float(nbytes) / size\n    return '{hnbytes:.{ndigits}f}{symbol}'.format(hnbytes=hnbytes,\n                                                  ndigits=ndigits,\n                                                  symbol=symbol)", "library": "boltons"}, {"a": "excutils._get_trace_str", "b": "iterutils.redundant", "jaccard": 0.0, "label": null, "a_file": "excutils.py", "a_line": 124, "a_src": "    def _get_trace_str(self):\n        if not self.cause:\n            return super().__repr__()\n        if self.full_trace:\n            return ''.join(traceback.format_list(self.full_trace))\n        return ''", "b_file": "iterutils.py", "b_line": 870, "b_src": "def redundant(src, key=None, groups=False):\n    \"\"\"The complement of :func:`unique()`.\n\n    By default returns non-unique/duplicate values as a list of the\n    *first* redundant value in *src*. Pass ``groups=True`` to get\n    groups of all values with redundancies, ordered by position of the\n    first redundant value. This is useful in conjunction with some\n    normalizing *key* function.\n\n    >>> redundant([1, 2, 3, 4])\n    []\n    >>> redundant([1, 2, 3, 2, 3, 3, 4])\n    [2, 3]\n    >>> redundant([1, 2, 3, 2, 3, 3, 4], groups=True)\n    [[2, 2], [3, 3, 3]]\n\n    An example using a *key* function to do case-insensitive\n    redundancy detection.\n\n    >>> redundant(['hi', 'Hi', 'HI', 'hello'], key=str.lower)\n    ['Hi']\n    >>> redundant(['hi', 'Hi', 'HI', 'hello'], groups=True, key=str.lower)\n    [['hi', 'Hi', 'HI']]\n\n    *key* should also be used when the values in *src* are not hashable.\n\n    .. note::\n\n       This output of this function is designed for reporting\n       duplicates in contexts when a unique input is desired. Due to\n       the grouped return type, there is no streaming equivalent of\n       this function for the time being.\n\n    \"\"\"\n    if key is None:\n        pass\n    elif callable(key):\n        key_func = key\n    elif isinstance(key, (str, bytes)):\n        def key_func(x): return getattr(x, key, x)\n    else:\n        raise TypeError('\"key\" expected a string or callable, not %r' % key)\n    seen = {}  # key to first seen item\n    redundant_order = []\n    redundant_groups = {}\n    for i in src:\n        k = key_func(i) if key else i\n        if k not in seen:\n            seen[k] = i\n        else:\n            if k in redundant_groups:\n                if groups:\n                    redundant_groups[k].append(i)\n            else:\n                redundant_order.append(k)\n                redundant_groups[k] = [seen[k], i]\n    if not groups:\n        ret = [redundant_groups[k][1] for k in redundant_order]\n    else:\n        ret = [redundant_groups[k] for k in redundant_order]\n    return ret", "library": "boltons"}, {"a": "ioutils.seek", "b": "tbutils.to_dict", "jaccard": 0.0, "label": null, "a_file": "ioutils.py", "a_line": 576, "a_src": "    def seek(self, offset, whence=os.SEEK_SET):\n        \"\"\"Enables setting position of the file cursor to a given\n        *offset*. Currently only supports ``offset=0``.\n        \"\"\"\n        if whence != os.SEEK_SET:\n            raise NotImplementedError(\n                'MultiFileReader.seek() only supports os.SEEK_SET')\n        if offset != 0:\n            raise NotImplementedError(\n                'MultiFileReader only supports seeking to s const KEY = "coherence-calibration-labels-v1";
let labels = JSON.parse(localStorage.getItem(KEY) || "{}");
let i = PAIRS.findIndex((p, n) => labels[n] === undefined);
if (i < 0) i = PAIRS.length - 1;

function render() {
  const p = PAIRS[i];
  document.getElementById("pos").textContent = `${i + 1} of ${PAIRS.length}`;
  const c = {same: 0, different: 0, unsure: 0};
  Object.values(labels).forEach(v => c[v] !== undefined && c[v]++);
  const n = Object.keys(labels).length;
  document.getElementById("tally").textContent =
    `${n} labelled — ${c.same} same, ${c.different} different, ${c.unsure} unsure`;
  document.getElementById("prog").style.width = (100 * n / PAIRS.length) + "%";
  document.getElementById("meta").innerHTML =
    `${p.library} &nbsp;·&nbsp; jaccard <b>${p.jaccard}</b>` +
    (labels[i] ? ` &nbsp;·&nbsp; <span class="done">already: ${labels[i]}</span>` : "");
  document.getElementById("ah").innerHTML = `${p.a} <span class="where">${p.a_file || ""}:${p.a_line || ""}</span>`;
  document.getElementById("bh").innerHTML = `${p.b} <span class="where">${p.b_file || ""}:${p.b_line || ""}</span>`;
  document.getElementById("asrc").textContent = p.a_src || "(source not captured)";
  document.getElementById("bsrc").textContent = p.b_src || "(source not captured)";
  window.scrollTo(0, 0);
}
function label(v) {
  labels[i] = v;
  localStorage.setItem(KEY, JSON.stringify(labels));
  if (i < PAIRS.length - 1) i++;
  render();
}
function back() { if (i > 0) i--; render(); }
function save() {
  const out = PAIRS.map((p, n) => {
    const r = Object.assign({}, p);
    r.label = labels[n] === undefined ? null : labels[n];
    return JSON.stringify(r);
  }).join("\n") + "\n";
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([out], {type: "application/jsonl"}));
  a.download = "pairs-labelled.jsonl";
  a.click();
}
addEventListener("keydown", e => {
  if (e.key === "s") label("same");
  else if (e.key === "d") label("different");
  else if (e.key === "u") label("unsure");
  else if (e.key === "ArrowLeft") back();
});
render();
</script>
